[project]
name = "norgesgruppen-detection"
version = "0.1.0"
description = "Grocery shelf product detection for NM i AI 2026"
requires-python = ">=3.11"
dependencies = [
    # Match sandbox versions exactly for submission compatibility
    "ultralytics==8.1.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "numpy==1.26.4",
    "Pillow==10.2.0",
    "pycocotools==2.0.7",
    "ensemble-boxes==1.0.9",
    "timm==0.9.12",
    "safetensors==0.4.2",
    "scipy==1.12.0",
    "scikit-learn==1.4.0",
    "opencv-python-headless==4.9.0.80",
    "albumentations==1.3.1",
    "supervision==0.18.0",
]

[tool.uv]
# Use CPU-only torch for local dev on macOS
# For GPU training, use: --index-url https://download.pytorch.org/whl/cu124
find-links = ["https://download.pytorch.org/whl/cpu"]
